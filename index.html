<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Information</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f5f8;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:380px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

/* New Banner Style */
.banner{
    width: 100%;
    height: 200px;
    background: #004085; /* Fallback color if image fails */
    overflow: hidden;
}

.banner img{
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.header{
    text-align:center;
    padding: 0 0px 0px 0px;
    position: relative;
}

.header img.profile-img{
    width:110px;
    height:110px;
    border-radius:50%;
    border:4px solid #fff;
    object-fit:cover;
    margin-top: -55px; /* Pulls the profile picture up into the banner area */
    margin-bottom:15px;
    position: relative;
    background: #fff; /* Prevents transparency issues */
}

.header h2{
    margin-bottom:5px;
}

.header p{
    opacity:.9;
}

.info{
    padding:25px;
}

.item{
    margin-bottom:15px;
    font-size:16px;
    color:#333;
}

.item strong{
    display:inline-block;
    width:90px;
}

.buttons{
    display:grid;
    gap:12px;
    margin-top:20px;
}

.btn{
    text-decoration:none;
    text-align:center;
    color:#fff;
    padding:13px;
    border-radius:8px;
    font-weight:bold;
    transition:.3s;
}

.call{background:#28a745;}
.email{background:#dc3545;}
.website{background:#0d6efd;}
.facebook{background:#1877F2;}
.location{background:#6f42c1;}

.btn:hover{
    opacity:.9;
    transform:translateY(-2px);
}

.footer{
    text-align:center;
    padding:18px;
    color:#888;
    font-size:13px;
    border-top:1px solid #eee;
}
</style>

</head>
<body>

<div class="card">

    </div>

    <div class="info">
